<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B1 — Log-wide three-column dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="variants.css">
  <script src="shared.js" defer></script>
  <script src="variants.js" defer></script>
</head>
<body>
  <div class="app">
    <student-sidebar></student-sidebar>
    <div class="workspace">
      <header class="app-topbar"><div class="mobile-brand">BNDS Insights</div><div class="breadcrumbs"><span>Students</span><span>/</span><b>Tao (Tom) Example</b></div><div class="top-context"><span>2026–27 · current</span><span class="user-avatar">DA</span></div></header>
      <main class="main">
        <div class="page-stack">
          <compact-profile-bar></compact-profile-bar>
          <div class="triple-top triple-b1">
            <log-card></log-card>
            <attendance-card></attendance-card>
            <triple-classes-card density="condensed"></triple-classes-card>
          </div>
          <div class="variant-work"><upcoming-card></upcoming-card><pastdue-card></pastdue-card></div>
          <div class="variant-context"><risk-card></risk-card><behavior-card></behavior-card><marks-card></marks-card></div>
          <footer class="mockup-foot"><span>B1 · Log-wide three-column dashboard</span><span>Log | Attendance | Classes · flat profile bar and maximum room for log text</span></footer>
        </div>
      </main>
    </div>
  </div>
  <variant-nav active="b1"></variant-nav>
</body>
</html>
